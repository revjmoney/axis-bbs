; Axis Micro BBS Firmware: telnet BBS firmware for the ESP32-2432S028R ("Cheap Yellow Display").
; Build and flash:  pio run -t upload --upload-port COMxx
; PC tests (portable code):  cmake -S . -B build -G Ninja && cmake --build build && build/axis_tests

[platformio]
default_envs = cyd

; SD pool and mirror instead of the disc changer: add -DAXIS_SD_POOL=1 to build_flags
[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino, espidf
platform_packages = framework-espidf @ 3.40407.240606
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
extra_scripts =
    pre:tools/pio_forward_slashes.py
    pre:tools/pio_sd_sources.py
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lovyan03/LovyanGFX@1.3.0
    symlink://third_party/sha256
build_flags =
    -O2
    -std=gnu++17
    -Isrc
    -DCORE_DEBUG_LEVEL=0
    ; LittleFS: the prebuilt esp_littlefs that ships inside Arduino-ESP32 2.0.17 (this IDF 4.4.7).
    ; packages_dir is PlatformIO's package root, so the same lines work on Linux and Windows.
    -DCONFIG_LITTLEFS_PAGE_SIZE=256
    -DCONFIG_LITTLEFS_MAX_PARTITIONS=3
    -I${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/esp_littlefs/include
    -L${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/lib
    -lesp_littlefs
build_unflags = -Os -std=gnu++11
build_src_filter = +<*> -<platform/pc/>

; One image for every board. Flash env cyd to the screens, the ring and any bare ESP32.
; A bare ESP32 (no screen) is told once over serial with "@HEADLESS on" (kept in NVS through
; reflashes); the ring (efuse MAC 30:76:f5:a7:03:6c) is headless without being told. Headless:
; no panel probe, one LED on GPIO 2, and the AXIS-SETUP hotspot when it has no saved WiFi.
; These names build that same image.
;   pio run -e cyd -t upload --upload-port COMxx
[env:headless]
extends = env:cyd

[env:headless-ring]
extends = env:cyd

; Bench only: heap tracing (sdkconfig.cyd-trace is sdkconfig.cyd with CONFIG_HEAP_TRACING_STANDALONE=y).
; Prints "@HT" lines on serial at each new heap low after @HEAPWIN: who holds what. Never flash it as the release.
[env:cyd-trace]
extends = env:cyd
build_flags = ${env:cyd.build_flags} -DAXIS_HEAP_TRACE=1
