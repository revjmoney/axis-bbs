; Axis Micro BBS Firmware: telnet BBS firmware for the ESP32-2432S028R ("Cheap Yellow Display").
; Build and flash:  pio run -t upload --upload-port COMxx
; PC tests (portable code):  cmake -S . -B build -G Ninja && cmake --build build && build/axis_tests

[platformio]
default_envs = cyd

; SD pool and mirror instead of the disc changer: add -DAXIS_SD_POOL=1 to build_flags
[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    symlink://third_party/sha256
    symlink://third_party/i8086
build_flags =
    -O2
    -std=gnu++17
    -Isrc
    -DCORE_DEBUG_LEVEL=0
build_unflags = -Os -std=gnu++11
build_src_filter = +<*> -<platform/pc/>

; A headless node: a plain ESP32 (no screen, no touch, no SD) that joins the cluster as more nodes.
; WiFi from the AXIS-SETUP hotspot page, settings and files from the main board, one LED on GPIO 2.
;   pio run -e headless -t upload --upload-port COMxx
[env:headless]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DAXIS_HEADLESS

; A headless node on Rev's eight-light ring board (the esp32-led-controller: reds on GPIO 23, 19, 12,
; 25 and greens on 22, 18, 14, 33): the cluster status runs round the ring.
;   pio run -e headless-ring -t upload --upload-port COM15
[env:headless-ring]
extends = env:headless
build_flags =
    ${env:headless.build_flags}
    -DAXIS_LEDRING
