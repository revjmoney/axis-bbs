; AXIS UNDERGROUND CNC: telnet BBS firmware for the ESP32-2432S028R ("Cheap Yellow Display").
; Build and flash:  pio run -t upload --upload-port COMxx
; PC tests (portable code):  cmake -S . -B build -G Ninja && cmake --build build && build/axis_tests

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    symlink://third_party/sha256
    symlink://third_party/i8086
build_flags =
    -O2
    -std=gnu++17
    -Isrc
    -DCORE_DEBUG_LEVEL=0
build_unflags = -Os -std=gnu++11
build_src_filter = +<*> -<platform/pc/>
