# Publishes the site/ folder (website + docs) and the installer lists to the gh-pages branch on
# every push to main. GitHub Pages serves that branch ("Deploy from a branch", gh-pages, root).
# Only the site's own files change: releases/ (release.yml) and builds/ (custom builds) stay.
name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "installer/*.json", "tools/ghpages.py", "tools/ci/ghpages_publish.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # push the gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Site to gh-pages
        run: sh tools/ci/ghpages_publish.sh "site from $GITHUB_SHA" python3 -I tools/ghpages.py site --site site --installer installer
