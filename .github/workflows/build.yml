# Host tests and the two firmware builds. No secrets. A failing compile or test fails the job.
name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Compilers
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build
      - name: Configure and test
        env:
          CC: gcc
          CXX: g++
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja
          cmake --build build
          ./build/axis_tests --reporters=console

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-6.1.18-espressif32-6.9.0-idf-3.40407.240606-${{ runner.os }}
      - name: PlatformIO 6.1.18
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          pip install platformio==6.1.18
      - name: Compile CYD
        run: |
          set -o pipefail
          pio run -e cyd -j 2 | tee cyd-build.log
          sh tools/ci/save_firmware_size.sh cyd
      - name: Compile headless
        run: |
          set -o pipefail
          pio run -e headless -j 2 | tee headless-build.log
          sh tools/ci/save_firmware_size.sh headless
      - name: Save size and map
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: firmware-size
          if-no-files-found: error
          path: |
            cyd-build.log
            headless-build.log
            build-size/
            .pio/build/cyd/axis-bbs.map
            .pio/build/headless/axis-bbs.map
