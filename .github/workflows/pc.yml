# axispc: build the native PC BBS and its packages for x86_64, ARM64, 32-bit ARM and Windows x64.
# Runs on pushes to main and pc/app, on pull requests to main, and on pc-v* tags. Each native runner builds axispc, runs the
# host tests, and makes a .deb (CPack) and an AppImage (linuxdeploy). The 32-bit ARM job cross
# compiles axispc and makes the .deb only. The Windows job builds with MinGW and makes a portable zip.
# A pc-v* tag attaches every artifact to a GitHub release. The release job runs only on those tags.
# Uses only the built in GITHUB_TOKEN. linuxdeploy is fetched by a pinned download step below.
name: PC app
on:
  push:
    branches: [main, pc/app]
    tags: ["pc-v*"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pc-${{ github.ref }}
  # Cancel a superseded branch run, but never a tag run (a release must finish).
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build tools
        run: sh tools/ci/apt_install.sh g++ cmake ninja-build file desktop-file-utils curl
      - name: Version from src/bbs/version.h
        run: |
          VER=$(sed -n 's/.*kAxisVersion[^"]*"\([0-9.]*\)".*/\1/p' src/bbs/version.h)
          test -n "$VER"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "axispc version $VER"
      - name: Build axispc and the tests
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DAXIS_WINDOW=OFF
          cmake --build build --target axispc axis_tests -j "$(nproc)"
      - name: Host tests
        run: ./build/axis_tests --reporters=console
      - name: Debian package
        run: |
          cd build && cpack -G DEB
          ls -l axispc_*.deb
      - name: AppImage (linuxdeploy)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy ships rolling builds; this is the latest dated tag at the time of writing.
          LD_TAG: 1-alpha-20251107-1
          LD_ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          url="https://github.com/linuxdeploy/linuxdeploy/releases/download/${LD_TAG}/linuxdeploy-${LD_ARCH}.AppImage"
          curl -fL --retry 3 -o linuxdeploy "$url"
          chmod +x linuxdeploy
          rm -rf AppDir
          ./linuxdeploy --appdir AppDir \
            --executable build/axispc \
            --desktop-file installer/pc/axispc.desktop \
            --icon-file installer/pc/axispc.svg \
            --output appimage
          mv ./*.AppImage "axispc-${VER}-${LD_ARCH}.AppImage"
          ls -l "axispc-${VER}-${LD_ARCH}.AppImage"
      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # axispc has no --help, so it prints its usage line and exits 2; we only check it runs.
          out=$(./axispc-${VER}-${{ matrix.arch }}.AppImage --help 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "usage: axispc"
      - name: Upload the package and AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: axispc-${{ env.VER }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/axispc_*.deb
            axispc-*.AppImage

  cross-armhf:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Cross tools (arm-linux-gnueabihf)
        run: sh tools/ci/apt_install.sh cmake ninja-build file g++-arm-linux-gnueabihf libc6-dev-armhf-cross
      - name: Version from src/bbs/version.h
        run: |
          VER=$(sed -n 's/.*kAxisVersion[^"]*"\([0-9.]*\)".*/\1/p' src/bbs/version.h)
          test -n "$VER"
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Cross build axispc
        run: |
          set -o pipefail
          cmake -S . -B build-armhf -G Ninja -DAXIS_WINDOW=OFF \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++
          cmake --build build-armhf --target axispc -j "$(nproc)"
          file build-armhf/axispc | grep -q ARM
      - name: Debian package (armhf)
        run: |
          cd build-armhf && cpack -G DEB -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE=armhf
          ls -l axispc_*_armhf.deb
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: axispc-${{ env.VER }}-armhf
          if-no-files-found: error
          retention-days: 14
          path: build-armhf/axispc_*.deb

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            zip
      - name: Version from src/bbs/version.h
        shell: msys2 {0}
        run: |
          VER=$(sed -n 's/.*kAxisVersion[^"]*"\([0-9.]*\)".*/\1/p' src/bbs/version.h)
          test -n "$VER"
          echo "VER=$VER" >> "$GITHUB_ENV"
          gcc -dumpmachine | grep -q mingw
      - name: Build axispc and the tests
        shell: msys2 {0}
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DAXIS_WINDOW=OFF -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build --target axispc axis_tests -j "$(nproc)"
      - name: Host tests
        shell: msys2 {0}
        run: ./build/axis_tests.exe --reporters=console
      - name: Portable zip (exe, art, README)
        shell: msys2 {0}
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist/art
          cp build/axispc.exe dist/
          cp installer/pc/README-windows.md dist/README.md
          cp -a art/. dist/art/
          (cd dist && zip -r "../axispc-${VER}-windows-x64.zip" .)
          ls -l "axispc-${VER}-windows-x64.zip"
      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: axispc-${{ env.VER }}-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: axispc-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/pc-v')
    needs: [package, cross-armhf, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # create the release and attach files
    env:
      TAG: ${{ github.ref_name }}
      # gh needs the repo, since this job does not check out a working tree.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: axispc-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          files=$(find dist -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.zip' \))
          echo "$files"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            # --latest=false so a PC package tag does not displace the firmware as the repo's Latest.
            gh release create "$TAG" $files --verify-tag --latest=false --title "axispc $TAG" --generate-notes
          fi
